# Scenario B for demo14.cfg (see there): identical 3-NN wrapper selection over
# the same 10 random 80/20 WDBC splits, but optimizing PLAIN accuracy — the
# comparison baseline for the balanced-accuracy scenario A.
data = "data/wdbc_30.trn"
splitter = "randrand"
rr-splits = 10
rr-train = 80
rr-test = 20
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "sfs"
target-d = 5
repeat-over-splits = true
tracker = "stabileval"

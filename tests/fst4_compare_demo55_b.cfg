# Scenario B of the fst4_compare_demo55 golden scenario (the demo55 protocol):
# normal Bhattacharyya filter + SFFS at target d=7 over the same data and
# splitting stack as scenario A on the command line (see tests/manifest.tsv).
# Keys = long option names without dashes (CLI11 config format, cf. fst4_demo10.cfg).
data = "data/wdbc_30.trn"
criterion = "bhattacharyya"
search = "sffs"
target-d = 7
splitter = "randrand"
rr-splits = 10
rr-train = 95
rr-test = 5
splitter2 = "cv"
splitter2-cv-folds = 3
tracker = "stabileval"
repeat-over-splits = true
verbosity = "silent"

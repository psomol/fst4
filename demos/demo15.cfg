# demo15.cfg — FST4 4.2 demo: Wrapper Selection Optimizing AUC (Area Under the ROC Curve)
# (A new FST4 demo number — no demo15 existed in FST3.)
# Threshold-free wrapper selection: the logistic-regression wrapper scores each
# candidate subset by the exact two-class AUC (Mann-Whitney rank statistic with
# midrank ties, computed from the model's per-sample decision scores) instead of
# accuracy at the default threshold. Same WDBC data as demo13t/demo14 but a
# different classifier under the wrapper (logistic regression exposes smooth
# probability scores — the natural AUC pairing; positive class = class index 1 =
# malignant). SFFS in d-optimizing mode, 50/50 split, 3-fold CV criterion
# estimation; the final validation line reports holdout accuracy AND AUC of the
# selected subset. Deterministic: logreg training is RNG-free and AUC tie
# handling is exact, so results are byte-identical at any --seed.
# See the --wrapper-metric entry in doc/FST4_CLI.md for the metric palette. AUC
# covers any class count: two-class is the exact binary AUC, K>2 the one-vs-rest
# macro AUC (demo27 demonstrates the multiclass case).
# This demo reads data/wdbc_30.csv — the CSV conversion of
# wdbc_30.trn (identical values and sample order) — demonstrating the CSV
# loader on real data; the results are identical to the TRN version.
# Run from the repo root:   ./fst4 --config demos/demo15.cfg
data = "data/wdbc_30.csv"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-logreg"
wrapper-metric = "auc"
search = "sffs"
validate = "same"

# demo54.cfg — Example 54: Feature Selection Stability Evaluation
# 3-NN wrapper + SFS in d-optimizing mode, run once per each of 10 random 80/20
# splits of WDBC data (3-fold CV criterion estimation per trial); the
# stability-evaluator tracker collects per-trial results and reports criterion
# value / subset size means and stddevs plus the stability measures
# (CWrel/ATI/CW/ANHI/SH/PH/C).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo54.cfg
data = "data/wdbc_30.trn"
splitter = "randrand"
rr-splits = 10
rr-train = 80
rr-test = 20
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "sfs"
repeat-over-splits = true
tracker = "stabileval"

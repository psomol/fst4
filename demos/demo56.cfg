# demo56.cfg — Example 56: Revealing feature selection results' bias
# 3-NN wrapper + Dynamic Oscillating Search (delta=1, d-optimizing) on sonar data
# (50/50 split, 3-fold CV criterion estimation); after the search the wrapper's
# bias (train-vs-test optimism) is estimated on the selected subset at splitting
# depth 1, and the result is kNN-validated on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo56.cfg
data = "data/sonar_60.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "dos"
dos-delta = 1
bias-estimate = true
validate = "same"

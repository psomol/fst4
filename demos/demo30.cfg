# demo30.cfg — Example 30: Feature selection on binary and/or natural-valued data
# Multinomial naive Bayes wrapper + Dynamic Oscillating Search (delta=10,
# d-optimizing) on binary mushroom data (single random 50/40 split, 5-fold CV
# criterion estimation), final multinomial NB validation on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo30.cfg
data = "data/mushroom_125.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
splitter2 = "cv"
splitter2-cv-folds = 5
criterion = "wrapper-multinom"
search = "dos"
dos-delta = 10
validate = "same"

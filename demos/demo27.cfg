# demo27.cfg — FST4 4.2 demo: Multiclass Selection by One-vs-Rest Macro AUC (no FST3 counterpart)
# (A new FST4 demo number — this is NOT an FST3 parity config; the number was
# never used by a publicly released FST3 demo.)
# On data with more than two classes,
# wrapper-metric = "auc" selects features by the one-vs-rest MACRO AUC — the
# unweighted mean over classes of the exact binary AUC (midrank tie rule)
# computed from each class's own score column against the rest; classes absent
# from a test part are skipped (the balanced-accuracy convention). Scores come
# from the classifier's classify_scores seam — here the logistic regression's
# per-class linear scores; all deterministic, RNG-free. On two-class data the
# same flag is the plain binary AUC (demo15).
# Contrast with demo15 (binary AUC on WDBC): same flag, richer data.
# Run from the repo root:   ./fst4 --config demos/demo27.cfg
data = "data/waveform_40.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-logreg"
wrapper-metric = "auc"
search = "sfs"
target-d = 5
validate = "same"

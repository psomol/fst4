# demo53.cfg — Example 53: Hybrid feature selection
# SVM wrapper (default RBF kernel) + SBS (sequential BACKWARD selection,
# d-optimizing) on WDBC data scaled to [0,1] (single random 50/40 split, 3-fold
# CV criterion estimation) with the hybrid step evaluator: a Bhattacharyya
# prefilter (initialized on the whole depth-0 train part) pre-orders candidates
# and only the best 50% reach the SVM wrapper; final SVM validation on the
# holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo53.cfg
data = "data/wdbc_30.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
splitter2 = "cv"
splitter2-cv-folds = 3
scaler = "to01"
criterion = "wrapper-svm"
search = "sbs"
evaluator = "hybrid"
hybrid-prefilter = "bhattacharyya"
hybrid-keep-perc = 50
validate = "same"

# demo32t.cfg — Example 32t: Threaded individual ranking (BIF) with SVM wrapper in very high-dimensional feature selection
# SVM wrapper (LINEAR kernel) + BIF individual ranking of the top 500 features
# with 2 evaluation threads on the 10k-feature reuters text data (single random
# 50/40 split, 3-fold CV criterion estimation), final SVM validation on the
# holdout.
# NOTE: compute-bound — 10105 SVM wrapper evaluations make this run for hours;
# LINEAR kernel may freeze LibSVM training on some data (see Known Issues).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo32t.cfg
data = "data/reuters_apte.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-svm"
svm-kernel = "linear"
search = "bif"
target-d = 500
validate = "same"
threads = 2

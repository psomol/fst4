# demo11.cfg — Example 11: Wrapper-based feature selection with Floating Search
# SVM wrapper (LINEAR kernel, C preset to 2.85117 as in the demo) + SFFS in
# d-optimizing mode on sonar data; criterion estimated by 3-fold CV on the train
# half of a single random 50/50 split, final SVM validation on the holdout.
# NOTE: LINEAR kernel may freeze LibSVM training on some data (see Known Issues).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo11.cfg
data = "data/sonar_60.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 50
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-svm"
svm-kernel = "linear"
svm-c = 2.85117
search = "sffs"
validate = "same"

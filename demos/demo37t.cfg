# demo37t.cfg — FST4 4.1 demo: Threaded budgeted stochastic (sampled) sequential search in extreme dimensionality
# (A new FST4-native demo, NOT an FST3 parity config: no public FST3 demo used this number.
# Suffix 't' = threaded, per the FST3 naming convention.)
# The stochastic-floating-search paper's reuters extreme-d protocol (arXiv:2608.01502):
# multinomial
# Bhattacharyya filter on the 10,105-feature reuters text data (single random 50/40
# split; the filter criterion runs directly on the depth-0 train part, demo31/33 data
# conventions) + SFFS at target d=500 with the SAMPLED step evaluator (forward cap 100,
# backward cap 50, softmax proposals with exploration floor 0.2, z-contrast statistics,
# warm-started by 2000 random probes of cardinality 25), criterion evaluations fanned
# out to 8 worker threads; sffs-delta 20 bounds the floating frontier at d=520 (the
# campaign used an equivalent external kill at its d=500 harvest bound) instead of the
# classic full frontier to d=10105; validated by the multinomial naive Bayes classifier
# on the holdout. The threaded sampled evaluator is BIT-IDENTICAL to --threads 1 at matched
# --seed for any thread count: proposals ride the master RNG stream and results replay
# in proposal order (see "Reproducibility" in doc/FST4_CLI.md).
# Runtime: minutes — the budgeted step makes d=500 on 10k features tractable where full
# floating search is not.
# Run from the repo root:   ./fst4 --config demos/demo37t.cfg
data = "data/reuters_apte.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
scaler = "void"
criterion = "multinom-bhattacharyya"
search = "sffs"
target-d = 500
sffs-delta = 20
evaluator = "sampled"
step-cap = 100
step-cap-backward = 50
step-explore = 0.2
step-tau = 0
step-decay = 100
step-sampler = "softmax"
step-stats = "zcontrast"
warmup-probes = 2000
warmup-card = 25
validate = "multinom"
threads = 8

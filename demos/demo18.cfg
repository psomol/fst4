# demo18.cfg — FST4 4.2 demo: Random Forest Wrapper Feature Selection
# (A new FST4 demo number — no demo18 existed in FST3.)
# The 4.2 dependency-free Random Forest as a wrapper criterion: 100 CART trees
# (Gini impurity, bagging, sqrt-mtry feature subsampling per node) score each
# candidate subset by 3-fold cross-validated accuracy on the spambase corpus
# (4601 e-mails, 57 word/char-frequency features, spam vs. ham) — the classic
# "practitioner" setting where a nonlinear ensemble is the model of choice.
# Determinism by design: RF training seeds derive from (subset content, --seed,
# split index), never from FST4's global fst_rand stream, so every subset
# evaluation is a pure function of its inputs — results are bit-identical at
# any --threads value and independent of evaluation order (--threads 4 below
# only changes the wall time). SFS to 10 features; final RF validation on the
# 50/50 holdout. Tune with --rf-trees/-mtry/-max-depth/-min-leaf; all 4.2
# wrapper metrics apply (e.g. wrapper-metric = "f1" for the spam class).
# Runs in well under a minute on a desktop (threads 4).
# Run from the repo root:   ./fst4 --config demos/demo18.cfg
data = "data/spambase_57.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-rf"
rf-trees = 100
search = "sfs"
target-d = 10
validate = "same"
threads = 4

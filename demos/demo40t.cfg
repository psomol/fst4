# demo40t.cfg — Example 40t: Threaded Exhaustive (optimal) feature selection
# The demo40 protocol with 16 evaluation threads: 3-NN wrapper (Lp distance,
# p=3/2) + exhaustive search over all C(30,5) = 142,506 subsets of size 5 on
# WDBC data (50/50 split, 3-fold CV criterion estimation); dupless tracker
# (capacity 50000, margin 0.05) records near-optimal alternatives, the 10 best
# are reported; final kNN validation on the holdout. Results are bit-identical
# to the sequential demo40.
# NOTE: long-running (minutes even at 16 threads; the golden scenario of the
# sequential form runs in the slow tier).
# FST3 demo parity config IN PROTOCOL, with the same forced deviation as
# demo40.cfg: exhaustive search
# bounded to target-d = 5 (the FST3 all-sizes enumeration of the 15-feature
# speech data is infeasible on the 30-feature WDBC replacement).
# Run from the repo root:   ./fst4 --config demos/demo40t.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
knn-distance = "Lp"
search = "exhaustive"
target-d = 5
tracker = "dupless"
tracker-capacity = 50000
tracker-margin = 0.05
top-k = 10
validate = "knn"
threads = 16

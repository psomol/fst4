# demo31.cfg — Example 31: Individual ranking (BIF) in very high-dimensional feature selection
# Multinomial Bhattacharyya filter + BIF individual ranking of the top 500
# features on the 10k-feature reuters text data (single random 50/40 split, no
# inner splitter), validated by the multinomial naive Bayes classifier on the
# holdout (validation classifier deliberately differs from the criterion).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo31.cfg
data = "data/reuters_apte.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
criterion = "multinom-bhattacharyya"
search = "bif"
target-d = 500
validate = "multinom"

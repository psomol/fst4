# demo60.cfg — Example 60: Detecting alternative feature selection results with equal criterion value
# 3-NN wrapper + Dynamic Oscillating Search (delta=3, d-optimizing) on optdigits
# (50/50 split, 3-fold CV criterion estimation); the dupless tracker is attached
# to the EVALUATOR so every evaluated candidate is offered to it (inclusion
# margin 0.05) — equal-value alternative subsets show up in the top-10 report;
# final kNN validation on the holdout. With no tracker-capacity key the dupless
# tracker keeps the top-k (10) best rather than every candidate as the FST3 demo
# did — result-neutral for this protocol, since the report prints the top 10
# either way.
# NOTE: long-running (the golden scenario runs in the slow tier).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo60.cfg
data = "data/optdigits_64.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "dos"
dos-delta = 3
tracker = "dupless"
tracker-margin = 0.05
tracker-attach = "evaluator"
top-k = 10
validate = "knn"

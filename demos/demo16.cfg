# demo16.cfg — FST4 4.2 demo: Cost-Sensitive Wrapper Selection with Per-Class Weights
# (A new FST4 demo number — no demo16 existed in FST3.)
# When error costs are asymmetric, encode them into the selection pressure:
# class-weights 1,5 makes every misclassified MALIGNANT case (class index 1,
# the 212-sample minority of WDBC) five times as costly as a misclassified
# benign one, so the normal-Bayes wrapper prefers subsets that protect recall
# on the malignant class. This differs from demo14's balanced accuracy: weights
# encode DOMAIN costs you choose (a screening scenario would use a much larger
# ratio); balanced accuracy merely equalizes class importance. The validation
# line reports plain holdout accuracy AND the weighted accuracy of the selected
# subset. 50/50 split, 3-fold CV criterion estimation, SFFS in d-optimizing mode.
# See the --wrapper-metric entry in doc/FST4_CLI.md for the palette. (class-weights
# deliberately does not combine with balanced-accuracy or auc — see --help.)
# Run from the repo root:   ./fst4 --config demos/demo16.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-bayes"
class-weights = "1,5"
search = "sffs"
validate = "same"

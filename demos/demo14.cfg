# demo14.cfg — FST4 4.2 demo: Balanced-Accuracy vs. Plain-Accuracy Wrapper Selection Compared
# (A new FST4 demo number — no demo14 existed in the public FST3.)
# Does the wrapper metric change WHICH features get selected? Scenario A (this
# file): 3-NN wrapper optimizing BALANCED accuracy (macro-averaged recall, the
# imbalance-robust choice — WDBC is a 357/212 benign/malignant split, so plain
# accuracy over-rewards the majority class). Scenario B
# (tests/fst4_compare_demo14_plain.cfg): identical except plain accuracy. Both
# repeat selection over the SAME 10 random 80/20 splits (3-fold CV criterion
# estimation) and are compared by cross-scenario tracker similarity
# (IATI/ICW/IANHI, the demo55 protocol): similarity < 1 quantifies how much the
# metric choice alone redirects the search.
# See the --wrapper-metric entry in doc/FST4_CLI.md for the metric palette; flip
# the wrapper-metric key to f1 for the positive-class (malignant) F1 variant.
# Run from the repo root:   ./fst4 --config demos/demo14.cfg
data = "data/wdbc_30.trn"
splitter = "randrand"
rr-splits = 10
rr-train = 80
rr-test = 20
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
wrapper-metric = "balanced-accuracy"
search = "sfs"
target-d = 5
repeat-over-splits = true
tracker = "stabileval"
compare-config = "tests/fst4_compare_demo14_plain.cfg"

# demo63.cfg — Example 63: Classification of new data samples on the selected subspace
# 3-NN wrapper + SFFS in d-optimizing mode on WDBC data (50/50 split, 3-fold CV
# criterion estimation), final kNN validation on the holdout; afterwards the
# classifier is trained on the depth-0 train part and classifies the new
# full-length sample vectors listed in tests/demo63_samples.txt (the demo's two
# hardcoded samples), printing the predicted class per row.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo63.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "sffs"
validate = "same"
classify-samples = "tests/demo63_samples.txt"

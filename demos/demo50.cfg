# demo50.cfg — Example 50: Voting ensemble of criteria
# SFS in d-optimizing mode on spambase data (50/50 split, 3-fold CV criterion
# estimation) with the ensemble step evaluator: kNN wrappers with k=1/5/9 vote on
# every candidate, the primary criterion (reported values) is the 3-NN wrapper;
# final kNN validation on the holdout.
# NOTE: long-running (the golden scenario runs in the slow tier). Every evaluator
# accepts --threads N with results bit-identical to sequential - add threads = 4
# below to cut the wall time roughly in half.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo50.cfg
data = "data/spambase_57.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "sfs"
evaluator = "ensemble"
ensemble-knn-ks = "1,5,9"
validate = "same"

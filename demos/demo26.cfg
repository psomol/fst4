# demo26.cfg — Example 26: Wrapper-based (normal Bayes) feature selection with Floating Search, verified by 2 classifiers
# Normal Bayes wrapper + SFFS in d-optimizing mode on WDBC data (50/50 split,
# 3-fold CV criterion estimation); the result is validated on the holdout by BOTH
# the Bayes classifier and 3-NN (dual validation).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo26.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-bayes"
search = "sffs"
validate = "same,knn"

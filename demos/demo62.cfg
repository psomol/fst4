# demo62.cfg — Example 62: (Missing data substitution) Combined feature subset contents, size and SVM parameters optimization
# The demo23 protocol on sonar data with missing values: the exact value 5 is
# treated as a missing-data code and substituted by the per-feature training
# average. SVM wrapper (RBF kernel) + Dynamic Oscillating Search (delta=3,
# d-optimizing; single random 50/40 split, 3-fold CV criterion estimation);
# alternating SVM parameter optimization and search while the train criterion
# improves, best parameters restored before the final SVM validation.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo62.cfg
data = "data/sonar_60_missing_data.trn"
missing-value = 5
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-svm"
svm-kernel = "rbf"
svm-optimize = "alternating"
search = "dos"
dos-delta = 3
validate = "same"

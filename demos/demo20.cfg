# demo20.cfg — Example 20: Retreating Sequential Search
# 3-NN wrapper + SFRS (Sequential Forward Retreating Search) in d-optimizing mode
# on WDBC data; criterion estimated by leave-one-out on the train half of a
# 50/50 split, final kNN validation on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo20.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "leave1out"
criterion = "wrapper-knn"
knn-k = 3
search = "sfrs"
validate = "same"

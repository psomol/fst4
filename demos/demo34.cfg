# demo34.cfg — Example 34: Dependency-Aware Feature Ranking (DAF0)
# Legacy-generation DAF on 5000-feature gisette data scaled to [0,1] (single
# random 50/50 split, 3-fold CV criterion estimation): Monte Carlo probes of
# cardinality 5..200 with a 1-NN wrapper feed the feature-stats tracker for 6
# hours (wall-clock budget, no trial limit); the DAF0 ranking then builds the
# top-200 subset incrementally with kNN validation after every added feature.
# NOTE: 6-hour wall-clock budget by design; results are load-dependent.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo34.cfg
data = "data/gisette_valid_nips_5000.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 50
splitter2 = "cv"
splitter2-cv-folds = 3
scaler = "to01"
criterion = "wrapper-knn"
knn-k = 1
search = "montecarlo"
mc-trials = 0
mc-seconds = 21600
mc-card-min = 5
mc-card-max = 200
tracker = "feature-stats"
daf-rank = 0
daf-count = 200
daf-validate-every = 1
validate = "knn"

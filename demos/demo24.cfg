# demo24.cfg — Example 24: Monte Carlo - random feature subset search
# 3-NN wrapper + Monte Carlo search over random subsets of cardinality 4..10 with
# a 100-second wall-clock budget (no trial limit) on WDBC data (50/50 split,
# 3-fold CV criterion estimation), final kNN validation on the holdout.
# NOTE: the wall-clock stopping condition makes results load-dependent — this
# config documents the protocol; it is not byte-reproducible across runs.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo24.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "montecarlo"
mc-trials = 0
mc-seconds = 100
mc-card-min = 4
mc-card-max = 10
validate = "same"

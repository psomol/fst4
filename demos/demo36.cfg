# demo36.cfg — FST4 4.1 demo: Budgeted stochastic (sampled) sequential search on very-high-dimensional data
# (A new FST4-native demo, NOT an FST3 parity config: no public FST3 demo used this number.)
# The stochastic-floating-search paper's gisette protocol (arXiv:2608.01502; its featured
# campaign arm):
# 1-NN wrapper on the 5000-feature gisette data scaled to [0,1] (single random 50/50
# split, 3-fold CV criterion estimation) + SFFS with the SAMPLED step evaluator — forward
# steps evaluate only 100 candidates proposed by softmax over online per-feature
# z-contrast statistics (exploration floor 0.2, automatic temperature, averaging horizon
# 100), backward steps are budgeted at 50, and the statistics are warm-started by 1000
# random probes of cardinality 25. Target subset size 300 (one of the paper's larger
# reported sizes); sffs-delta 20 bounds the floating frontier at d=320 — the paper
# campaign's harvest bound — instead of the classic full frontier to d=5000; final kNN
# validation on the holdout. Per-step cost is bounded by the candidate budget
# independent of the 5000-feature dimensionality — full floating search is infeasible
# on this data.
# NOTE: long-running (hours to reach d=320).
# Run from the repo root:   ./fst4 --config demos/demo36.cfg
data = "data/gisette_valid_nips_5000.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 50
splitter2 = "cv"
splitter2-cv-folds = 3
scaler = "to01"
criterion = "wrapper-knn"
knn-k = 1
knn-distance = "L2"
search = "sffs"
target-d = 300
sffs-delta = 20
evaluator = "sampled"
step-cap = 100
step-cap-backward = 50
step-explore = 0.2
step-tau = 0
step-decay = 100
step-sampler = "softmax"
step-stats = "zcontrast"
warmup-probes = 1000
warmup-card = 25
validate = "same"

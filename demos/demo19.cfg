# demo19.cfg — FST4 4.2 demo: Ridge Regression Wrapper Scored by R-squared
# (A new FST4 demo number — no demo19 existed in FST3.)
# The linear counterpart of demo17: closed-form ridge regression (L2-regularized
# least squares solved by Cholesky on internally standardized features, bias
# unpenalized; ridge-lambda tunes the penalty) as the wrapper criterion, scored
# by R^2 — wrapper-ridge defaults to that metric, no wrapper-metric key needed.
# Same WDBC data, split and search as demo17, so the two configs compare the
# linear model against the weighted-neighbours regressor directly (on this data
# ridge reaches a higher holdout R^2 with the same subset size). Deterministic
# and RNG-free like the logistic-regression classifier: results are
# byte-identical at any --seed and --threads. The validation line reports the
# plain regressor value AND the holdout R^2.
# See the --wrapper-metric entry in doc/FST4_CLI.md for the metric palette.
# Run from the repo root:   ./fst4 --config demos/demo19.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-ridge"
search = "sfs"
target-d = 5
validate = "same"

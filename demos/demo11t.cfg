# demo11t.cfg — Example 11t: Threaded wrapper-based feature selection with Floating Search
# 3-NN wrapper + SFFS in d-optimizing mode with 2 evaluation threads on the
# 10k-feature reuters text data; criterion estimated by leave-one-out on the train
# half of a single random 50/50 split, final kNN validation on the holdout.
# NOTE: compute-bound — leave-one-out kNN over 10105 features makes this run for
# many hours; it demonstrates the threaded evaluator, not a quick result.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo11t.cfg
data = "data/reuters_apte.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 50
splitter2 = "leave1out"
criterion = "wrapper-knn"
knn-k = 3
search = "sffs"
validate = "same"
threads = 2

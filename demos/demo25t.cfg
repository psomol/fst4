# demo25t.cfg — Example 25t: Fast pre-selection followed by Dynamic Oscillating Search
# SVM wrapper (SIGMOID kernel) on optdigits (50/50 split, 3-fold CV criterion
# estimation): BIF individual ranking pre-selects the top 20 features to seed a
# threaded (4 threads) Dynamic Oscillating Search (delta=3, d-optimizing); SVM
# parameters are grid-optimized on the full set and re-optimized on the BIF seed
# (--svm-optimize pre), final SVM validation on the holdout.
# NOTE: long-running (tens of minutes; the golden scenario runs in the slow tier).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo25t.cfg
data = "data/optdigits_64.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-svm"
svm-kernel = "sigmoid"
svm-optimize = "pre"
search2 = "bif"
search2-d = 20
search = "dos"
dos-delta = 3
validate = "same"
threads = 4

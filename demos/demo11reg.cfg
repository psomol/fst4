# demo11reg.cfg — Example 11: Wrapper-based (regression) feature selection with Floating Search
# Weighted-neighbours regression wrapper (the class label = dependent variable) + SFFS
# in d-optimizing mode; kernel-multiplier sweep {0.3, 0.35, 0.4} runs one full
# search per value and the best-by-train-value wins (demo11reg protocol),
# validated by regressor train/test on the 50/50 holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo11reg.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-regressor"
search = "sffs"
regr-multipliers = "0.3,0.35,0.4"
validate = "same"

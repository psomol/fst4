# demo38.cfg — FST4 4.2 demo: Linear SVM Wrapper Feature Selection (no LibSVM needed)
# (A new FST4 demo number — no public FST3 demo used it.)
# The 4.2 dependency-free linear SVM as a wrapper criterion: L2-regularized
# squared-hinge SVM trained by dual coordinate descent (the Hsieh et al. 2008
# method, implemented from scratch) on internally standardized features. The
# coordinate order is fixed cyclic — no RNG anywhere, so results are
# byte-identical at any --seed and --threads. This also retires the
# long-documented LibSVM LINEAR-kernel freeze for linear-SVM selection: no
# external library is involved at all. Same spambase protocol as demo18, so
# the linear margin model contrasts directly with the Random Forest (linear
# decision boundaries vs. axis-aligned ensembles on word-frequency features).
# Tune with linsvm-c / linsvm-loss (l1|l2) / linsvm-maxiter / linsvm-tol; all
# 4.2 wrapper metrics apply (e.g. wrapper-metric = "auc").
# This demo reads data/spambase_57.csv — the CSV conversion of
# spambase_57.trn (identical values and sample order) — demonstrating the CSV
# loader on real data; the results are identical to the TRN version.
# Run from the repo root:   ./fst4 --config demos/demo38.cfg
data = "data/spambase_57.csv"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-linsvm"
search = "sfs"
target-d = 10
validate = "same"
threads = 4

# demo40.cfg — Example 40: Exhaustive (optimal) feature selection
# 3-NN wrapper (Lp distance, p=3/2) + exhaustive search over all C(30,5) =
# 142,506 subsets of size 5 on WDBC data (50/50 split, 3-fold CV criterion
# estimation); a dupless tracker (capacity 50000, inclusion margin 0.05) records
# near-optimal alternatives, the 10 best are reported; final kNN validation on
# the holdout.
# NOTE: long-running (minutes; the golden scenario runs in the slow tier).
# FST3 demo parity config IN PROTOCOL, with one forced deviation: the FST3 demo
# ran exhaustive search
# over ALL subset sizes of the 15-feature speech data, which is no longer
# distributed; on the 30-feature WDBC replacement the full 2^30 enumeration is
# infeasible, so the search is bounded to target-d = 5.
# Run from the repo root:   ./fst4 --config demos/demo40.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
knn-distance = "Lp"
search = "exhaustive"
target-d = 5
tracker = "dupless"
tracker-capacity = 50000
tracker-margin = 0.05
top-k = 10
validate = "knn"

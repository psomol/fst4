# demo23.cfg — Example 23: Combined feature subset contents, size and SVM parameters optimization
# SVM wrapper (RBF kernel) + Dynamic Oscillating Search (delta=3, d-optimizing) on
# sonar data (single random 50/40 split, 3-fold CV criterion estimation);
# alternating protocol: SVM C/gamma grid optimization and search repeat while the
# train criterion improves, best parameters restored before the final SVM
# validation on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo23.cfg
data = "data/sonar_60.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-svm"
svm-kernel = "rbf"
svm-optimize = "alternating"
search = "dos"
dos-delta = 3
validate = "same"

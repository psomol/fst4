# demo55.cfg — Example 55: Evaluating Similarity of Two Feature Selection Processes
# Two feature-selection scenarios run over the SAME 10 random 95/5 splits of
# WDBC data and are compared by cross-scenario tracker similarity
# (IATI/ICW/IANHI). Scenario A (this file): 3-NN wrapper with L1 distance + DOS
# (delta=10, d-optimizing). Scenario B (tests/fst4_compare_demo55_b.cfg): normal
# Bhattacharyya filter + SFFS at target d=7, re-initialized per split. Both use
# 3-fold CV criterion estimation and the stability-evaluator tracker.
# FST3 demo parity config; the compiled exemplar demo55.cpp still ships and
# implements the same protocol.
# Run from the repo root:   ./fst4 --config demos/demo55.cfg
data = "data/wdbc_30.trn"
splitter = "randrand"
rr-splits = 10
rr-train = 95
rr-test = 5
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
knn-distance = "L1"
search = "dos"
dos-delta = 10
repeat-over-splits = true
tracker = "stabileval"
compare-config = "tests/fst4_compare_demo55_b.cfg"

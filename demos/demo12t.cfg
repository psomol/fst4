# demo12t.cfg — Example 12t: Threaded SVM-wrapper-based feature selection with Dynamic Oscillating Search
# SVM wrapper (RBF kernel) with pre-search C/gamma grid optimization + sequential
# search with 2 evaluation threads on waveform data (50/50 split, 3-fold CV
# criterion estimation), final SVM validation on the holdout.
# NOTE: the demo's active code path is SFS despite the DOS in its title.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo12t.cfg
data = "data/waveform_40.arff"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-svm"
svm-kernel = "rbf"
svm-optimize = "pre"
search = "sfs"
validate = "same"
threads = 2

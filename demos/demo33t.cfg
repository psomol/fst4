# demo33t.cfg — Example 33t: Threaded Oscillating Search in very high-dimensional feature selection
# The demo33 protocol with 8 evaluation threads: multinomial Bhattacharyya filter
# on the 10k-feature reuters text data (single random 50/40 split), BIF ranking
# seeds the initial 500-feature subset, Oscillating Search (delta=1) refines it
# at d=500; validated by the multinomial naive Bayes classifier on the holdout.
# NOTE: long-running.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo33t.cfg
data = "data/reuters_apte.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
criterion = "multinom-bhattacharyya"
search2 = "bif"
search = "os"
os-delta = 1
target-d = 500
validate = "multinom"
threads = 8

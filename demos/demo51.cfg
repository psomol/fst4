# demo51.cfg — Example 51: (DOS) Result regularization using secondary criterion
# 3-NN wrapper + Dynamic Oscillating Search (delta=3, d-optimizing) on waveform
# data (50/50 split, 3-fold CV criterion estimation); the regularizer tracker
# records EVERY evaluated candidate, then for each margin 0.001..0.009 the
# smallest subset within margin of the best criterion value is reported
# (secondary criterion: negated subset size) and kNN-validated on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo51.cfg
data = "data/waveform_40.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "dos"
dos-delta = 3
tracker = "regularizer"
regularize-by = "subsetsize"
regularize-margins = "0.001,0.002,0.003,0.004,0.005,0.006,0.007,0.008,0.009"
validate = "same"

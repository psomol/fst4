# demo29.cfg — FST4 4.2 demo: RBF SVM Wrapper with Alternating C/gamma Optimization (no LibSVM needed)
# (A new FST4 demo number — this is NOT an FST3 parity config; the number was
# never used by a publicly released FST3 demo.)
# The full demo23 protocol on the native RBF kernel SVM: rbfsvm-optimize =
# "alternating" tunes C and gamma by the same space-filling random search as
# LibSVM's --svm-optimize (candidates repel already-tested points, weighted
# against bad regions; all randomness from fst_rand on the master thread, so
# runs are deterministic at matched --seed), first on the full feature set,
# then re-optimizing and re-searching while the training criterion improves.
# Completes the demo28 story: demo28 = the protocol with fixed defaults,
# demo29 = with the hyperparameter grid — no LibSVM involved in either.
# Results are deliberately NOT bit-comparable to demo23's LibSVM numbers.
# Note the classic small-sample lesson (the demo5x anti-overfitting theme):
# the optimized criterion rises while the independent holdout may drop —
# hyperparameter tuning on ~100 training samples overfits easily.
# Run from the repo root:   ./fst4 --config demos/demo29.cfg
data = "data/sonar_60.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-rbfsvm"
rbfsvm-optimize = "alternating"
search = "dos"
dos-delta = 3
validate = "same"

# demo64.cfg — FST4 4.2 demo: External-Classifier Bridge (bring your own model)
# (A new FST4 demo number — no demo64 existed in FST3; it sits in the demo6x
# complementary group, where an integration scenario belongs topically.)
# Feature selection wrapped around a classifier THAT IS NOT PART OF FST4: the
# wrapper-extern criterion launches the extern-cmd command once (a persistent
# child process per criterion clone) and drives it through a line protocol —
# "TRAIN <N> <d> <K>" + N labeled rows, answered by "OK", then "TEST <M> <d>"
# + M rows, answered by M predicted class indices, repeated for every candidate
# subset. The command here is the shipped reference implementation, a
# nearest-centroid classifier in awk (tests/extern_centroid.awk) — swap in any
# scikit-learn/R/Julia model behind the same three-message protocol.
# TWO LOUD CAVEATS (see doc/FST4_CLI.md): the command is USER-SUPPLIED CODE
# EXECUTION (treat configs with extern-cmd like scripts), and FST4's
# reproducibility guarantees END AT THE BRIDGE — determinism is now the
# external model's responsibility. AUC is unavailable (labels-only protocol);
# confusion-based metrics (balanced-accuracy, f1, class-weights) work.
# Needs awk on PATH (any Unix; Git Bash on Windows).
# Run from the repo root:   ./fst4 --config demos/demo64.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-extern"
extern-cmd = "awk -f tests/extern_centroid.awk"
search = "sfs"
target-d = 5
validate = "same"

# demo42.cfg — Example 42: Branch and Bound with Partial Prediction (BBPP) optimal feature selection
# Bhattacharyya filter + BBPP (averaging predictor) at target d=10 on wdbc data
# (50/50 split, no inner splitter); a dupless tracker (capacity 50000, inclusion
# margin 0.05) records near-optimal alternatives, the 10 best are reported;
# validated by 3-NN (Lp distance, p=3/2) on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo42.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
criterion = "bhattacharyya"
search = "bb-bbpp"
target-d = 10
tracker = "dupless"
tracker-capacity = 50000
tracker-margin = 0.05
top-k = 10
knn-distance = "Lp"
validate = "knn"

# demo44.cfg — FST4-native demo: multinomial Mutual Information term ranking
# The multinom-mi criterion (individual MI; a subset evaluates to the
# SUM of its per-feature MI values) + BIF ranking of the top 500 features on the
# 10k-feature reuters text data — deliberately the exact demo31 protocol with MI
# in place of the multinomial Bhattacharyya, so the two term-goodness rankings
# compare one flag for one flag. MI(f) = sum_c P(c)·theta(f|c)·log(theta(f|c)/P(f))
# with P(f) = sum_c P(c)·theta(f|c) is each term's share of the mutual information
# between term occurrence and class under the multinomial model (P(c) = the class's
# share of the total term length; every share is non-negative). On this data the
# two criteria rank largely the same top terms; MI weights a term by how much of
# the corpus it accounts for, Bhattacharyya by how differently the classes use it.
# NOT an FST3 parity config (no public FST3 demo ever used this number).
# Run from the repo root:   ./fst4 --config demos/demo44.cfg
data = "data/reuters_apte.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
criterion = "multinom-mi"
search = "bif"
target-d = 500
validate = "multinom"

# demo13t.cfg — FST4 4.1 demo: Threaded wrapper-based feature selection with a logistic regression classifier
# (A new FST4 demo number — no demo13 existed in FST3; suffix 't' = threaded, as in
# demo11t/demo12t.)
# Multinomial logistic regression wrapper (new in 4.1: dependency-free damped-Newton
# training, internally standardized per split, RNG-free) + SFFS in d-optimizing mode
# with 2 evaluation threads on the WDBC breast-cancer diagnostic data — a two-class
# problem with continuous clinical features that is close to linearly separable, i.e.
# exactly the regime where logistic regression is the textbook classifier choice
# (50/50 split, 3-fold CV criterion estimation); final logistic-regression validation
# on the holdout. Training is deterministic by construction, so results are
# byte-identical at any --seed and --threads. (For a true multiclass logistic
# regression case, swap in data/waveform_40.trn — its 3 classes derive from linear
# combinations of base waves and also suit a linear model well.)
# Run from the repo root:   ./fst4 --config demos/demo13t.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-logreg"
search = "sffs"
validate = "same"
threads = 2

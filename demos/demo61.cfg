# demo61.cfg — Example 61: Feature selection that respects pre-specified feature weights
# 3-NN wrapper + SFFS in d-optimizing mode on WDBC data (50/50 split, 3-fold CV
# criterion estimation); the regularizer tracker records EVERY evaluated
# candidate, then for each margin 0..0.045 the cheapest subset within margin of
# the best criterion value is reported (secondary criterion: negated sum of the
# per-feature acquisition costs below) and kNN-validated on the holdout. The
# costs are illustrative (as in the FST3 demo): the first 15 are the FST3
# demo61 values, extended to WDBC's 30 features in the same spirit.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo61.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "sffs"
tracker = "regularizer"
regularize-by = "weights"
feature-costs = "1,1.2,1,1.3,1.02,2.4,3.9,1.2,7.1,22,9.52,1.08,3.27,1.44,1.04,2.1,1.15,5.6,1.02,3.4,12,1.33,2.05,1.1,8.4,1.7,4.2,1.06,2.9,6.3"
regularize-margins = "0,0.005,0.01,0.015,0.02,0.025,0.03,0.035,0.04,0.045"
validate = "same"

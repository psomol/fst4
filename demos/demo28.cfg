# demo28.cfg — FST4 4.2 demo: RBF Kernel SVM Wrapper Feature Selection (no LibSVM needed)
# (A new FST4 demo number — this is NOT an FST3 parity config; the number was
# never used by a publicly released FST3 demo.)
# The 4.2 dependency-free RBF kernel SVM as a wrapper criterion: C-SVC trained
# by kernel dual coordinate descent with the penalized-bias kernel offset
# (implemented from scratch — no LibSVM code anywhere). The coordinate order is
# fixed cyclic — no RNG, so results are byte-identical at any --seed and
# --threads. Together with wrapper-linsvm (demo38) this covers both SVM kernels
# of practical value natively; LibSVM remains an optional extension for
# cross-checks and the FST3 parity configs only. Same sonar protocol as the
# LibSVM-based demo23 (minus its --svm-optimize grid search), so the native
# kernel machine contrasts directly with the LibSVM path: results are NOT
# bit-comparable by design (different solver, penalized bias, internal
# standardization) — expect near-identical accuracy. Gamma defaults to
# 1/subset-size on the internally standardized features; tune with rbfsvm-c /
# rbfsvm-gamma / rbfsvm-loss (l1|l2) / rbfsvm-maxiter / rbfsvm-tol; all 4.2
# wrapper metrics apply (e.g. wrapper-metric = "auc").
# Run from the repo root:   ./fst4 --config demos/demo28.cfg
data = "data/sonar_60.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-rbfsvm"
search = "dos"
dos-delta = 3
validate = "same"

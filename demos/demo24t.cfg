# demo24t.cfg — Example 24t: Threaded Monte Carlo - random feature subset search
# 3-NN wrapper + Monte Carlo search with 4 evaluation threads; random subsets are
# drawn by per-feature inclusion probability 0.5 (instead of a cardinality range)
# under a 100-second wall-clock budget on WDBC data (50/50 split, 3-fold CV
# criterion estimation), final kNN validation on the holdout.
# NOTE: the wall-clock stopping condition makes results load-dependent.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo24t.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "montecarlo"
mc-trials = 0
mc-seconds = 100
mc-card-prob = 0.5
validate = "same"
threads = 4

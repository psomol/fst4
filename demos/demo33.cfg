# demo33.cfg — Example 33: Oscillating Search in very high-dimensional feature selection
# Multinomial Bhattacharyya filter on the 10k-feature reuters text data (single
# random 50/40 split, no inner splitter): BIF individual ranking seeds the
# initial 500-feature subset, then Oscillating Search (delta=1) refines it at
# d=500; validated by the multinomial naive Bayes classifier on the holdout.
# NOTE: long-running (the golden scenario runs in the slow tier).
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo33.cfg
data = "data/reuters_apte.arff"
splitter = "randrand"
rr-splits = 1
rr-train = 50
rr-test = 40
criterion = "multinom-bhattacharyya"
search2 = "bif"
search = "os"
os-delta = 1
target-d = 500
validate = "multinom"

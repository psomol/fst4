# demo17.cfg — FST4 4.2 demo: Regression Feature Selection Scored by R-squared
# (A new FST4 demo number — no demo17 existed in FST3.)
# The regression counterpart of the 4.2 wrapper-metric family: the
# weighted-neighbours regression wrapper (demo11reg's engine) scores candidate
# subsets by the coefficient of determination R^2 — an interpretable,
# scale-free criterion (1 = perfect prediction, 0 = no better than predicting
# the mean) — instead of the plain negated-error value. neg-rmse and
# neg-mae are the alternative regression metrics; all are higher-is-better as
# the search maximizes. WDBC data, 50/50 split, 3-fold CV criterion
# estimation, SFS to 5 features; the validation line reports the plain
# regressor value AND the holdout R^2 of the selected subset.
# See the --wrapper-metric entry in doc/FST4_CLI.md for the metric palette.
# Run from the repo root:   ./fst4 --config demos/demo17.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-regressor"
wrapper-metric = "r2"
search = "sfs"
target-d = 5
validate = "same"

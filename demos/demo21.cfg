# demo21.cfg — Example 21: Generalized sequential feature subset search
# 5-NN wrapper + generalized SFFS (g-tuples of 2 features added/removed per step)
# in d-optimizing mode on WDBC data (50/50 split, 3-fold CV criterion
# estimation), final 5-NN validation on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo21.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 5
search = "sffs"
generalization-level = 2
validate = "same"

# demo10.cfg — Example 10: Basic Filter-based feature selection
# Generalized Mahalanobis filter + SFS at target d=7 on 50/50-split WDBC data,
# validated by 3-NN on the held-out part (subset 3 10 16 20 21 26 27, value
# 12.1045, holdout accuracy 0.8947).
# FST3 demo parity config; the compiled exemplar
# demo10.cpp still ships and produces the same result.
# Run from the repo root:   ./fst4 --config demos/demo10.cfg
data = "data/wdbc_30.trn"
splitter = "5050"
criterion = "gmahalanobis"
search = "sfs"
target-d = 7
validate = "knn"

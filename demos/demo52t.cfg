# demo52t.cfg — Example 52t: (Threaded SFRS) Result regularization using secondary criterion
# 3-NN wrapper + Sequential Forward Retreating Search with 2 evaluation threads
# on waveform data (50/50 split, 3-fold CV criterion estimation); the regularizer
# tracker records EVERY evaluated candidate, then for each margin 0.001..0.009
# the smallest subset within margin of the best criterion value is reported
# (secondary criterion: negated subset size) and kNN-validated on the holdout.
# NOTE: long-running (about ten minutes; the golden scenario runs in the slow tier).
# FST3 demo parity config; the compiled exemplar demo52t.cpp still ships and
# implements the same protocol.
# Run from the repo root:   ./fst4 --config demos/demo52t.cfg
data = "data/waveform_40.trn"
splitter = "5050"
splitter2 = "cv"
splitter2-cv-folds = 3
criterion = "wrapper-knn"
knn-k = 3
search = "sfrs"
tracker = "regularizer"
regularize-by = "subsetsize"
regularize-margins = "0.001,0.002,0.003,0.004,0.005,0.006,0.007,0.008,0.009"
validate = "same"
threads = 2

# demo22.cfg — Example 22: Randomized feature selection with Oscillating Search
# Bhattacharyya filter + Oscillating Search (delta=10) at target d=30 on sonar
# data (single random 75/25 split, no inner splitter), rerun from random initial
# subsets until 4 consecutive runs fail to improve (reproduces the demo's
# 5-consecutive-runs stop rule under the CLI's counting), final 3-NN validation
# on the holdout.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo22.cfg
data = "data/sonar_60.trn"
splitter = "randrand"
rr-splits = 1
rr-train = 75
rr-test = 25
criterion = "bhattacharyya"
search = "os"
os-delta = 10
target-d = 30
restarts-nonimproving = 4
validate = "knn"

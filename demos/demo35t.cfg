# demo35t.cfg — Example 35t: Dependency-Aware Feature Ranking (DAF1) to enable Wrapper based FS on very-high-dimensional data
# Legacy-generation DAF on the 10k-feature reuters text data with whitening
# normalization (resubstitution outer, leave-one-out inner splitting): threaded
# (4 threads) Monte Carlo probes of cardinality 5..50 with an SVM wrapper (RBF
# kernel, parameters grid-optimized pre-search) feed the feature-stats tracker
# for 300 seconds; the DAF1 ranking then builds the top-1000 subset incrementally
# with SVM validation every 50th added feature.
# NOTE: wall-clock budget — results are load-dependent; SVM on reuters is heavy.
# FST3 demo parity config.
# Run from the repo root:   ./fst4 --config demos/demo35t.cfg
data = "data/reuters_apte.arff"
splitter = "resub"
splitter2 = "leave1out"
scaler = "white"
criterion = "wrapper-svm"
svm-kernel = "rbf"
svm-optimize = "pre"
search = "montecarlo"
mc-trials = 0
mc-seconds = 300
mc-card-min = 5
mc-card-max = 50
tracker = "feature-stats"
daf-rank = 1
daf-count = 1000
daf-validate-every = 50
validate = "same"
threads = 4
